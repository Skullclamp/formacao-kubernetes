# Sessão 5 — Secret de laboratório para PostgreSQL
#
# ATENÇÃO: o valor abaixo é exclusivamente didático. Não reutilizar em produção.
# Kubernetes Secret separa dados sensíveis da definição do workload, mas não
# deve ser descrito como automaticamente seguro apenas por usar Base64.

apiVersion: v1
kind: Secret

metadata:
  name: postgres-credentials

# Opaque é o tipo genérico para pares chave/valor definidos pela aplicação.
type: Opaque

# `stringData` aceita texto legível no manifesto e o API Server converte-o
# para a representação em `data`. Isto é conveniência de criação, não encriptação.
stringData:
  password: lab-postgres-password
