# Sessão 5 — HTTPRoute da Symfony Demo
#
# Objetivo: associar um hostname e uma regra de path ao Gateway criado no
# manifesto anterior e encaminhar o tráfego para o Service `symfony-demo`.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: symfony-demo

spec:
  parentRefs:
    # Anexa esta rota ao Gateway `symfony-gateway` do mesmo Namespace.
    - name: symfony-gateway

  # A rota só corresponde quando o pedido usa este hostname.
  hostnames:
    - symfony-gateway.lab

  rules:
    - matches:
        - path:
            # PathPrefix faz corresponder `/` e todos os subcaminhos.
            type: PathPrefix
            value: /

      backendRefs:
        # Backend lógico da aplicação. O HTTPRoute não aponta diretamente
        # para um Pod; aponta para o Service que representa os Pods saudáveis.
        - name: symfony-demo

          # Porta do Service de destino.
          port: 80
