apiVersion: v1
kind: Pod
metadata:
  name: test-storage
spec:
  containers:
    - name: test-storage
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: dados
          mountPath: /data
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: test-pvc
