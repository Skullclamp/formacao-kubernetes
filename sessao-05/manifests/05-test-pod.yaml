# Sessão 5 — Pod consumidor da PVC `test-pvc`
#
# Objetivo: fornecer o primeiro consumidor da PVC para demonstrar
# `WaitForFirstConsumer` e depois usar o mesmo volume para provar persistência.

apiVersion: v1
kind: Pod

metadata:
  name: test-storage

spec:
  containers:
    - name: test-storage

      # BusyBox fornece uma shell simples para escrever e ler ficheiros.
      image: busybox:1.36

      # Mantém o container ativo durante o exercício para podermos usar
      # `kubectl exec` e manipular /data manualmente.
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: dados

          # Dentro do container, o volume será apresentado em /data.
          mountPath: /data

  volumes:
    - name: dados

      # Este volume do Pod é fornecido pela PVC criada no passo anterior.
      # O Pod não referencia diretamente o PV nem o caminho físico do Worker.
      persistentVolumeClaim:
        claimName: test-pvc
