apiVersion: v1
kind: Pod
metadata:
  name: pg-client
spec:
  containers:
    - name: psql
      image: postgres:16
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
  restartPolicy: Never
