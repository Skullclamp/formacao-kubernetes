services:
  demo:
    # Container mínimo usado apenas para observar como o Compose disponibiliza secrets.
    image: alpine:3.20

    # O serviço recebe explicitamente o secret demo_secret.
    # O Compose monta-o como ficheiro read-only em /run/secrets/demo_secret.
    # O comando apenas confirma a existência e o tamanho; não imprime o conteúdo.
    command: ["sh", "-c", "ls -l /run/secrets && wc -c /run/secrets/demo_secret && sleep 60"]
    secrets:
      - demo_secret

# O valor do secret vem da variável de ambiente DEMO_SECRET existente no HOST.
# Assim evitamos criar um ficheiro .txt com o valor do secret na pasta do projeto.
# O Compose cria o secret a partir desse valor e entrega-o apenas ao serviço autorizado.
secrets:
  demo_secret:
    environment: DEMO_SECRET
