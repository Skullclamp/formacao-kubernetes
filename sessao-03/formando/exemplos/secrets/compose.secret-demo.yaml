services:
  demo:
    # Container mínimo usado apenas para observar como o Compose monta secrets.
    image: alpine:3.20

    # Lista /run/secrets, mostra o tamanho do ficheiro demo_secret e mantém
    # o container ativo durante 60 segundos para permitir inspeção manual.
    # O comando não imprime o conteúdo do secret.
    command: ["sh", "-c", "ls -l /run/secrets && wc -c /run/secrets/demo_secret && sleep 60"]

    # Concede explicitamente este secret ao serviço demo.
    # O ficheiro fica disponível em /run/secrets/demo_secret dentro do container.
    secrets:
      - demo_secret

# Declara a origem do secret no host.
# demo_secret.txt é criado localmente a partir do exemplo e não deve ser versionado.
secrets:
  demo_secret:
    file: ./demo_secret.txt
