# VirtualHost HTTP que recebe pedidos na porta 80 dentro do container.
<VirtualHost *:80>
    # Contacto administrativo apresentado pelo Apache em alguns erros.
    ServerAdmin webmaster@localhost

    # Symfony publica a aplicação a partir de public/, não da raiz do projeto.
    DocumentRoot /var/www/html/public

    # Regras aplicadas apenas ao diretório público da aplicação.
    <Directory /var/www/html/public>
        # Permite que .htaccess complemente a configuração do Apache.
        AllowOverride All

        # Autoriza pedidos HTTP a este diretório.
        Require all granted

        # Quando não existe um ficheiro físico correspondente ao URL,
        # encaminha o pedido para index.php, o front controller do Symfony.
        FallbackResource /index.php
    </Directory>

    # Logs do VirtualHost. O Apache escreve nos caminhos definidos pela imagem.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
