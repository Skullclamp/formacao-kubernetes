spec:
  template:
    spec:
      serviceAccountName: app-reader
      automountServiceAccountToken: false
      containers:
        - name: symfony
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - SETUID
                - SETGID
