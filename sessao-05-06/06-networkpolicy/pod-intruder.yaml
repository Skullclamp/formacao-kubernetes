apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: lab-admin
  labels:
    role: intruder
spec:
  restartPolicy: Never
  containers:
    - name: intruder
      image: nicolaka/netshoot:v0.16
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
