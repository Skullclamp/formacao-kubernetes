apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: lab-admin
  labels:
    role: debug
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: nicolaka/netshoot:v0.16
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
