apiVersion: batch/v1
kind: Job
metadata:
  name: backup-postgres
  namespace: lab-admin
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        role: backup
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: postgres:16
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              pg_dump \
                -h postgres \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /backup/backup.sql
              test -s /backup/backup.sql
              echo "Backup criado: /backup/backup.sql"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: backup-pvc
