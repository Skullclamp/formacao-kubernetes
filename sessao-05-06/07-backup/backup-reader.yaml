apiVersion: v1
kind: Pod
metadata:
  name: backup-reader
  namespace: lab-admin
  labels:
    role: backup-reader
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: backup
          mountPath: /backup
          readOnly: true
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: backup-pvc
