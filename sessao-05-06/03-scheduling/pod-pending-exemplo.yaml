apiVersion: v1
kind: Pod
metadata:
  name: pod-pending-exemplo
  namespace: lab-admin
spec:
  restartPolicy: Never
  nodeSelector:
    laboratorio: valor-inexistente
  containers:
    - name: espera
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
