# Sessão 4 — instalação Calico mínima para o laboratório
#
# Nesta sessão pretendemos validar o CNI e a conectividade do cluster.
# Componentes opcionais de observabilidade/API (APIServer, Goldmane e Whisker)
# ficam fora deste manifesto para reduzir ruído e consumo de recursos no cluster
# pedagógico de apenas dois nós.
#
# Baseline validada:
# - Kubernetes 1.35.8 -> 1.36.4
# - Calico 3.32.2
# - rede física dos hosts: 192.168.50.0/24
# - Pod CIDR: 10.244.0.0/16 (sem sobreposição com a rede física)

apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    ipPools:
      - name: default-ipv4-ippool
        blockSize: 26
        cidr: 10.244.0.0/16
        encapsulation: VXLANCrossSubnet
        natOutgoing: Enabled
        nodeSelector: all()
