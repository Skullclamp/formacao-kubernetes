# Valores mínimos para kube-prometheus-stack no laboratório.
# O chart deve ser descarregado e validado pelo formador antes da sessão.

defaultRules:
  create: false

grafana:
  enabled: false

alertmanager:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 2h
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
