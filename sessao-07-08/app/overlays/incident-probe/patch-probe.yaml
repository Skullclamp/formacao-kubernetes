apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-demo
spec:
  template:
    spec:
      containers:
        - name: symfony
          # Falha controlada: o processo continua Running, mas este endpoint
          # não existe e a nova réplica não entra nos endpoints do Service.
          readinessProbe:
            httpGet:
              path: /ready-inexistente
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
