apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # O serviceName liga o StatefulSet ao Headless Service `postgres`,
  # assegurando identidade de rede estável para o Pod stateful.
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        role: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # A readiness confirma que PostgreSQL aceita ligações antes de ser
          # considerado pronto pelas dependências do laboratório.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          # RWO é adequado ao único Pod PostgreSQL deste cenário pedagógico.
          - ReadWriteOnce
        # O precheck confirma explicitamente esta StorageClass.
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
