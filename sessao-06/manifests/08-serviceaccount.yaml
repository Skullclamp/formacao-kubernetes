# Sessão 6 — ServiceAccount dedicada ao workload
#
# Objetivo: criar uma identidade própria para o workload em vez de depender
# implicitamente da ServiceAccount `default` do Namespace.

apiVersion: v1
kind: ServiceAccount

metadata:
  name: app-reader
  namespace: s6-governance

# Neste checkpoint o token fica explícito para fins pedagógicos de identidade.
# Workloads que não necessitem de falar com a Kubernetes API devem considerar
# `automountServiceAccountToken: false` para reduzir exposição desnecessária.
automountServiceAccountToken: true
