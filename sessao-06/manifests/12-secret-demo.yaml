# Sessão 6 — Secret de laboratório
#
# Objetivo: trabalhar o objeto Secret sem utilizar qualquer credencial real.
# `stringData` é conveniente para criação, mas o valor será representado em
# `data` com Base64. Base64 é codificação, não encriptação.

apiVersion: v1
kind: Secret

metadata:
  name: db-demo
  namespace: s6-governance

# Tipo genérico para dados definidos pela aplicação.
type: Opaque

stringData:
  # Valores exclusivamente fictícios para a formação.
  username: demo
  password: lab-only-not-a-real-secret
