# Sessão 6 — Workloads mínimos para testar NetworkPolicy
#
# Estes recursos não substituem a aplicação transversal Symfony. Servem apenas
# para isolar a variável REDE e construir um cenário simples com três papéis:
#
#   net-client  → cliente de diagnóstico
#   net-app     → serviço HTTP/Nginx
#   net-db      → serviço PostgreSQL
#
# Labels como `role=client` e `component=app|db` são deliberadas: as policies
# posteriores usam-nas para definir quem pode comunicar com quem.

# ---------------------------------------------------------------------------
# Aplicação HTTP
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-app
  namespace: s6-governance
spec:
  replicas: 1
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        # Esta label identifica a camada de aplicação nas NetworkPolicies.
        component: app
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "96Mi"

---

# Service estável para chegar aos Pods `component=app`.
apiVersion: v1
kind: Service
metadata:
  name: net-app
  namespace: s6-governance
spec:
  selector:
    component: app
  ports:
    - # Porta do Service dentro do cluster.
      port: 80
      # Porta HTTP do container Nginx selecionado.
      targetPort: 80

---

# ---------------------------------------------------------------------------
# Base de dados PostgreSQL
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-db
  namespace: s6-governance
spec:
  replicas: 1
  selector:
    matchLabels:
      component: db
  template:
    metadata:
      labels:
        # Esta label identifica a camada de dados nas NetworkPolicies.
        component: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            # Utilizador e password são lidos do Secret fictício `db-demo`.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-demo
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-demo
                  key: password
            - name: POSTGRES_DB
              value: lab
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

# Service interno PostgreSQL.
apiVersion: v1
kind: Service
metadata:
  name: net-db
  namespace: s6-governance
spec:
  selector:
    component: db
  ports:
    - port: 5432
      targetPort: 5432

---

# ---------------------------------------------------------------------------
# Cliente de diagnóstico
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: s6-governance
  labels:
    # As policies de egress usam esta label para identificar a origem cliente.
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36

      # Mantém o cliente vivo para testes repetidos com nslookup, wget e nc.
      command: ["sh", "-c", "sleep 3600"]

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
