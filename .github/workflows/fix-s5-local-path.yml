name: Corrigir Local Path Provisioner no laboratório S5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-s5-local-path.yml
      - .github/tmp/fix-s5-local-path.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar laboratório integrado
        run: |
          set -euo pipefail
          python3 .github/tmp/fix-s5-local-path.py
          rm -f .github/tmp/fix-s5-local-path.py
          rm -f .github/workflows/fix-s5-local-path.yml
          git config user.name 'Skullclamp'
          git config user.email 'tiago.skullclamp@gmail.com'
          git add -A
          git commit -m 'Sessão 5: instalar e validar Local Path Provisioner antes do CP2'
          git push origin main
