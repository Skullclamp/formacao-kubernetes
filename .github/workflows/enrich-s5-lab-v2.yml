name: Enriquecer laboratório integrado S5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-s5-lab-v2.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enriquecer explicações pedagógicas
        shell: bash
        run: |
          set -euo pipefail
          LAB='sessao-05-06/labs/laboratorio_integrado_sessao_5.md'
          sed -i 's/get pods        → deve ser permitido/get pods       → deve ser permitido/' "$LAB"
          sed -i 's/^delete pods     → deve ser negado/ delete pods    → deve ser negado/' "$LAB"
          base64 -d .github/tmp/s5-enrich.patch.b64 | gzip -d > /tmp/s5-enrich.patch
          patch --batch -p1 --fuzz=3 < /tmp/s5-enrich.patch || true
          rm -f "${LAB}.rej" "${LAB}.orig"
          sed -i 's/na Fase de scheduling/no CP3 — scheduling/' "$LAB"
          sed -i 's/da Fase de scheduling/do CP3 — scheduling/' "$LAB"
          sed -i 's/rollouts da Fase 2/rollouts do CP2/' "$LAB"
          grep -q 'Como ler os comandos deste laboratório' "$LAB"
          test "$(grep -c 'O que o formando deve perceber' "$LAB")" -ge 8
          test "$(grep -c 'Como interpretar' "$LAB")" -ge 20
          test "$(grep -c 'O que observar' "$LAB")" -ge 20
          ! grep -qE '\([0-9]+ min\)|240 minutos|^#* Intervalo' "$LAB"
          git config user.name 'Skullclamp'
          git config user.email 'tiago.skullclamp@gmail.com'
          git add "$LAB"
          git commit -m 'Sessão 5: explicar comandos, flags e critérios de validação'
          git push origin main
