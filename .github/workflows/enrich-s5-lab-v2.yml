name: Completar explicação RBAC laboratório S5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-s5-lab-v2.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Completar explicação RBAC
        run: python3 .github/tmp/fix-rbac.py
      - name: Guardar alteração
        run: |
          git config user.name 'Skullclamp'
          git config user.email 'tiago.skullclamp@gmail.com'
          git add sessao-05-06/labs/laboratorio_integrado_sessao_5.md
          git commit -m 'Sessão 5: completar explicação pedagógica de RBAC'
          git push origin main
