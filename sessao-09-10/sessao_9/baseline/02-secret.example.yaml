# EXEMPLO — NÃO APLICAR SEM SUBSTITUIR OS PLACEHOLDERS.
# Não colocar credenciais reais num repositório de formação.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_DB: "symfony"
  POSTGRES_USER: "symfony"
  POSTGRES_PASSWORD: "ALTERAR_PASSWORD"
  APP_SECRET: "ALTERAR_APP_SECRET"
  # Se a password tiver caracteres reservados de URI, deve ser devidamente codificada.
  DATABASE_URL: "postgresql://symfony:ALTERAR_PASSWORD@postgres:5432/symfony?serverVersion=16&charset=utf8"
