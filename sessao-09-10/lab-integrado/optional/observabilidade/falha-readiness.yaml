apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-troubleshoot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: symfony-troubleshoot
  template:
    metadata:
      labels:
        app: symfony-troubleshoot
    spec:
      containers:
        - name: symfony
          image: ghcr.io/skullclamp/symfony-demo:1.1.0
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: symfony-demo-config
                  key: APP_ENV
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: symfony-demo-config
                  key: APP_VERSION
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready-erro
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: symfony-troubleshoot
spec:
  selector:
    app: symfony-troubleshoot
  ports:
    - name: http
      port: 80
      targetPort: http
