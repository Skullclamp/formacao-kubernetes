spec:
  template:
    spec:
      containers:
        - name: symfony
          image: ghcr.io/skullclamp/symfony-demo:1.2.0-rc1
          readinessProbe:
            httpGet:
              path: /ready-errado
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
