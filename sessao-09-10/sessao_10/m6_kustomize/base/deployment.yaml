apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-demo-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: symfony-demo-kustomize
  template:
    metadata:
      labels:
        app: symfony-demo-kustomize
    spec:
      containers:
        - name: symfony
          image: ghcr.io/skullclamp/symfony-demo:1.1.0
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: symfony-demo-kustomize-config
                  key: APP_ENV
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: symfony-demo-kustomize-config
                  key: APP_VERSION
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
