apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -prod
replicas:
  - name: symfony-demo-kustomize
    count: 2
configMapGenerator:
  - name: symfony-demo-kustomize-config
    behavior: merge
    literals:
      - APP_ENV=prod
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: symfony-demo-kustomize
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
